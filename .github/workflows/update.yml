name: update

on:
  schedule:
    - cron: "17 5 6 * *"   # sixth of each month; does nothing unless the SEC has posted a new quarter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download any quarter not yet stored
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python3 update.py

      - name: Check the rules and build the page
        if: always()
        run: |
          python3 -I tests/test_monitor.py
          python3 -I tests/test_published.py
          python3 -I build.py
          test -s _site/index.html

      - name: Hand the built page to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Store the new data in the repository
        if: always()
        run: |
          git add data api
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git config user.name "Agisilaos Papadogiannis"
          git config user.email "apapadogiannis@gmail.com"
          git commit -m "Data: quarters to $(ls data/nport | sort | tail -1)"
          git pull --rebase
          git push

  publish:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the page
        id: deployment
        uses: actions/deploy-pages@v5
